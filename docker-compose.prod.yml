services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-rag_user} -d ${POSTGRES_DB:-rag_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    # AE-0302: auth required + fail-closed entrypoint. The entrypoint refuses
    # to start an OPEN Redis when REDIS_PASSWORD is empty in a production-like
    # environment, and disables admin verbs (CONFIG/FLUSHALL/FLUSHDB/DEBUG/
    # SHUTDOWN) so an authed-but-compromised peer cannot silently re-open auth.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes:
      - redis_data:/data
      - ./scripts/deploy/redis-entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
    command: sh /usr/local/bin/redis-entrypoint.sh
    healthcheck:
      # $$ defers to the container env (not compose interpolation).
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rag_user}:${POSTGRES_PASSWORD:-rag_password}@postgres:5432/${POSTGRES_DB:-rag_db}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      GLM_API_KEY: ${GLM_API_KEY:-}
      # AE-0391: per-task carousel models + automatic GLM fallback.
      LLM_MODEL_REASONING: ${LLM_MODEL_REASONING:-deepseek-v4-pro}
      LLM_MODEL_FAST: ${LLM_MODEL_FAST:-deepseek-v4.1-flash}
      LLM_MODEL_FALLBACK: ${LLM_MODEL_FALLBACK:-qwen3.8-flash}
      LLM_MODEL_FALLBACK_REASONING: ${LLM_MODEL_FALLBACK_REASONING:-qwen3.8-max}
      CONTENT_DRAFT_CONCURRENCY: ${CONTENT_DRAFT_CONCURRENCY:-4}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ANON_SECRET_KEY: ${ANON_SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://marinssolutions.com}
      REDIS_URL: redis://redis:6379
      # AE-0302: managed credential — the backend factory injects it into the
      # URL; keep REDIS_URL credential-free so the two sources cannot conflict.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DEBUG: "false"
      CAROUSEL_CHECKPOINT_BACKEND: ${CAROUSEL_CHECKPOINT_BACKEND:-memory}
      CAROUSEL_CHECKPOINT_POSTGRES_URL: ${CAROUSEL_CHECKPOINT_POSTGRES_URL:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      # AE-0359: autopilot stays off until AUTOPILOT_ENABLED is true.
      META_IG_ACCESS_TOKEN: ${META_IG_ACCESS_TOKEN:-}
      META_IG_USER_ID: ${META_IG_USER_ID:-}
      CAROUSEL_PUBLIC_BASE_URL: ${CAROUSEL_PUBLIC_BASE_URL:-https://marinssolutions.com}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      GROKBOT_API_KEY_SHA256: ${GROKBOT_API_KEY_SHA256:-}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      AUTOPILOT_ENABLED: ${AUTOPILOT_ENABLED:-false}
      AUTOPILOT_OWNER_USER_ID: ${AUTOPILOT_OWNER_USER_ID:-}
      AUTOPILOT_DAILY_CAP: ${AUTOPILOT_DAILY_CAP:-1}
      AUTOPILOT_DEFAULT_PUBLISH: ${AUTOPILOT_DEFAULT_PUBLISH:-now}
      AUTOPILOT_PERSONA_ID: ${AUTOPILOT_PERSONA_ID:-}
      # AE-0407: reasoning-model slide-fix attempts (0 = off).
      AUTOPILOT_AUTOFIX_ESCALATION_ATTEMPTS: ${AUTOPILOT_AUTOFIX_ESCALATION_ATTEMPTS:-2}
      # AE-0393: GrokBot image bridge, off until IMAGE_BRIDGE_ENABLED is true.
      IMAGE_BRIDGE_ENABLED: ${IMAGE_BRIDGE_ENABLED:-false}
      IMAGE_BRIDGE_FALLBACK_ENABLED: ${IMAGE_BRIDGE_FALLBACK_ENABLED:-true}
      IMAGE_BRIDGE_TIMEOUT_SECONDS: ${IMAGE_BRIDGE_TIMEOUT_SECONDS:-600}
      IMAGE_BRIDGE_MAX_CONCURRENCY: ${IMAGE_BRIDGE_MAX_CONCURRENCY:-1}
      IMAGE_BRIDGE_PUBLIC_BASE_URL: ${IMAGE_BRIDGE_PUBLIC_BASE_URL:-https://marinssolutions.com}
      GROKBOT_IMAGE_WEBHOOK_URL: ${GROKBOT_IMAGE_WEBHOOK_URL:-}
      GROKBOT_IMAGE_WEBHOOK_AUTH_HEADER: ${GROKBOT_IMAGE_WEBHOOK_AUTH_HEADER:-Authorization}
      GROKBOT_IMAGE_WEBHOOK_AUTH_VALUE: ${GROKBOT_IMAGE_WEBHOOK_AUTH_VALUE:-}
      # AE-0399: model queue per role (empty = AE-0391 routing), the OpenCode
      # sidecar for the free model, breaker cooldowns, and the alerts bot.
      LLM_MODEL_QUEUE_FAST: ${LLM_MODEL_QUEUE_FAST:-}
      LLM_MODEL_QUEUE_REASONING: ${LLM_MODEL_QUEUE_REASONING:-}
      OPENCODE_SIDECAR_URL: ${OPENCODE_SIDECAR_URL:-}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      TELEGRAM_ALERTS_BOT_TOKEN: ${TELEGRAM_ALERTS_BOT_TOKEN:-}
      TELEGRAM_ALERTS_CHAT_ID: ${TELEGRAM_ALERTS_CHAT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - carousel_output:/app/output
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  generation-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - pgq
      - run
      - rag_backend.worker.main:create_pgqueuer
      - --heartbeat-timeout
      - "300"
      - --batch-size
      - "1"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rag_user}:${POSTGRES_PASSWORD:-rag_password}@postgres:5432/${POSTGRES_DB:-rag_db}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      GLM_API_KEY: ${GLM_API_KEY:-}
      LLM_MODEL_REASONING: ${LLM_MODEL_REASONING:-deepseek-v4-pro}
      LLM_MODEL_FAST: ${LLM_MODEL_FAST:-deepseek-v4.1-flash}
      LLM_MODEL_FALLBACK: ${LLM_MODEL_FALLBACK:-qwen3.8-flash}
      LLM_MODEL_FALLBACK_REASONING: ${LLM_MODEL_FALLBACK_REASONING:-qwen3.8-max}
      CONTENT_DRAFT_CONCURRENCY: ${CONTENT_DRAFT_CONCURRENCY:-4}
      SECRET_KEY: generation-worker-signs-no-tokens
      ANON_SECRET_KEY: generation-worker-signs-no-tokens
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DEBUG: "false"
      CAROUSEL_CHECKPOINT_BACKEND: ${CAROUSEL_CHECKPOINT_BACKEND:-memory}
      CAROUSEL_CHECKPOINT_POSTGRES_URL: ${CAROUSEL_CHECKPOINT_POSTGRES_URL:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      CAROUSEL_PUBLIC_BASE_URL: ${CAROUSEL_PUBLIC_BASE_URL:-https://marinssolutions.com}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID:-}
      AUTOPILOT_ENABLED: ${AUTOPILOT_ENABLED:-false}
      AUTOPILOT_OWNER_USER_ID: ${AUTOPILOT_OWNER_USER_ID:-}
      AUTOPILOT_PERSONA_ID: ${AUTOPILOT_PERSONA_ID:-}
      AUTOPILOT_AUTOFIX_ESCALATION_ATTEMPTS: ${AUTOPILOT_AUTOFIX_ESCALATION_ATTEMPTS:-2}
      IMAGE_BRIDGE_ENABLED: ${IMAGE_BRIDGE_ENABLED:-false}
      IMAGE_BRIDGE_FALLBACK_ENABLED: ${IMAGE_BRIDGE_FALLBACK_ENABLED:-true}
      IMAGE_BRIDGE_TIMEOUT_SECONDS: ${IMAGE_BRIDGE_TIMEOUT_SECONDS:-600}
      IMAGE_BRIDGE_MAX_CONCURRENCY: ${IMAGE_BRIDGE_MAX_CONCURRENCY:-1}
      IMAGE_BRIDGE_PUBLIC_BASE_URL: ${IMAGE_BRIDGE_PUBLIC_BASE_URL:-https://marinssolutions.com}
      GROKBOT_IMAGE_WEBHOOK_URL: ${GROKBOT_IMAGE_WEBHOOK_URL:-}
      GROKBOT_IMAGE_WEBHOOK_AUTH_HEADER: ${GROKBOT_IMAGE_WEBHOOK_AUTH_HEADER:-Authorization}
      GROKBOT_IMAGE_WEBHOOK_AUTH_VALUE: ${GROKBOT_IMAGE_WEBHOOK_AUTH_VALUE:-}
      LLM_MODEL_QUEUE_FAST: ${LLM_MODEL_QUEUE_FAST:-}
      LLM_MODEL_QUEUE_REASONING: ${LLM_MODEL_QUEUE_REASONING:-}
      OPENCODE_SIDECAR_URL: ${OPENCODE_SIDECAR_URL:-}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      TELEGRAM_ALERTS_BOT_TOKEN: ${TELEGRAM_ALERTS_BOT_TOKEN:-}
      TELEGRAM_ALERTS_CHAT_ID: ${TELEGRAM_ALERTS_CHAT_ID:-}
      GENERATION_WORKER_CONCURRENCY: ${GENERATION_WORKER_CONCURRENCY:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - carousel_output:/app/output
    read_only: true
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=0700,size=512m
      - /app/.cache:uid=1001,gid=1001,mode=0700,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1344m
    memswap_limit: 1344m
    cpus: 1.0
    cpu_shares: 256
    shm_size: 256m
    pids_limit: 512
    stop_grace_period: 300s
    healthcheck:
      test: ["CMD", "python", "-m", "rag_backend.worker.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # AE-0399: OpenCode sidecar serving the free DeepSeek model (first in the
  # carousel model queue). Isolated: no secrets but its own server password,
  # no published ports, read-only root, tmpfs scratch. Its OpenCode login
  # lives in the opencode_data volume at /data/opencode (`docker compose exec
  # opencode opencode auth login` once after the first deploy).
  opencode:
    build:
      context: ops/opencode
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      # Optional Cloudflare Worker egress (ops/egress-worker): when set, the
      # sidecar's OpenCode API traffic exits via Cloudflare IPs, not this
      # host's. Empty = direct egress (previous behavior).
      OPENCODE_EGRESS_URL: ${OPENCODE_EGRESS_URL:-}
      OPENCODE_EGRESS_TOKEN: ${OPENCODE_EGRESS_TOKEN:-}
    read_only: true
    # AE-0402: tmpfs mounts are root-owned by default; the agent runs as 10001
    # and writes all over its home at runtime (see ops/opencode/Dockerfile).
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
      - /work:uid=10001,gid=10001,mode=0700
      - /home/opencode:uid=10001,gid=10001,mode=0700,size=512m
    volumes:
      - opencode_data:/data/opencode
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 256
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    environment:
      NEXT_PUBLIC_API_URL: /api
      API_BASE_URL: http://backend:8000
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.ssl:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  langfuse-db-init:
    image: postgres:17-alpine
    entrypoint:
      - sh
      - -c
      - |
        until pg_isready -h postgres -U "$$POSTGRES_USER"; do sleep 1; done
        PGPASSWORD=$$POSTGRES_PASSWORD createdb -h postgres -U "$$POSTGRES_USER" langfuse 2>/dev/null || echo "langfuse database already exists"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-config/docker_related_config.xml:/etc/clickhouse-server/config.d/docker_related_config.xml:ro
      - ./clickhouse-config/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
    environment:
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-changeme}
      CLICKHOUSE_DB: langfuse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: "1.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    # AE-0480: MinIO, Inc. withdrew every public image (Docker Hub minio/minio
    # since AE-0331, quay.io/minio/minio 401 since 2026-10-13). pgsty/minio is
    # the community-maintained AGPLv3 fork of the same server: same `minio`
    # binary, MINIO_* env, /data layout and bundled `mc`. This is its last
    # release under the MinIO name; the tag@digest pin is immutable.
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:-changeme}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio-init:
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    entrypoint:
      - sh
      - -c
      - |
        until mc alias set local http://minio:9000 langfuse "$$MINIO_ROOT_PASSWORD" 2>/dev/null; do sleep 2; done
        mc mb -p local/langfuse-events
    environment:
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:-changeme}
    depends_on:
      minio:
        condition: service_started
    restart: "no"

  langfuse:
    # Pinned: the floating :3 tag broke prod on 2026-06-12 when a new release
    # changed ingestion requirements. Bump web + worker together, deliberately.
    image: langfuse/langfuse:3.185
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rag_user}:${POSTGRES_PASSWORD:-rag_password}@postgres:5432/langfuse
      DIRECT_URL: postgresql://${POSTGRES_USER:-rag_user}:${POSTGRES_PASSWORD:-rag_password}@postgres:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
      NEXTAUTH_URL: ${LANGFUSE_HOST:-http://localhost:3001}
      SALT: ${LANGFUSE_SALT:-}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse:${LANGFUSE_CLICKHOUSE_PASSWORD:-changeme}@clickhouse:9000
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-changeme}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_DEFAULT_ORG_ID: ${LANGFUSE_DEFAULT_ORG_ID:-default}
      LANGFUSE_DEFAULT_PROJECT_ID: ${LANGFUSE_DEFAULT_PROJECT_ID:-default}
      LANGFUSE_DEFAULT_PROJECT_NAME: ${LANGFUSE_DEFAULT_PROJECT_NAME:-alter-ego}
      # AE-0302: Langfuse shares this Redis — its connection must carry the
      # password or enabling requirepass NOAUTHs the whole observability stack.
      REDIS_CONNECTION_STRING: redis://:${REDIS_PASSWORD:-}@redis:6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-changeme}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      TELEMETRY_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=448
    depends_on:
      postgres:
        condition: service_healthy
      langfuse-db-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  langfuse-worker:
    # Required: the worker consumes the Redis ingestion queue and writes traces
    # to ClickHouse. Without it, ingested events never become visible traces.
    image: langfuse/langfuse-worker:3.185
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rag_user}:${POSTGRES_PASSWORD:-rag_password}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT:-}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse:${LANGFUSE_CLICKHOUSE_PASSWORD:-changeme}@clickhouse:9000
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-changeme}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      # AE-0302: Langfuse shares this Redis — its connection must carry the
      # password or enabling requirepass NOAUTHs the whole observability stack.
      REDIS_CONNECTION_STRING: redis://:${REDIS_PASSWORD:-}@redis:6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-changeme}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      TELEMETRY_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      langfuse-db-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  certbot_data:
  certbot_www:
  carousel_output:
  minio_data:
  opencode_data:
