events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=chat_api:10m rate=6r/m;

    # Preserve original protocol from CloudFlare (or fallback to $scheme)
    map $http_x_forwarded_proto $real_scheme {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Upstream definitions
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    # HTTP server (temporary, until SSL is configured)
    server {
        listen 80;
        server_name _;  # Accept any hostname

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "origin-when-cross-origin" always;

        # Frontend (Next.js) — static assets: far-future cache
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            expires 365d;
            add_header Cache-Control "public, immutable" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "origin-when-cross-origin" always;
        }

        # Frontend (Next.js) — dynamic pages: no cache
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_hide_header Cache-Control;
            # Hide Cloudflare geo headers that crash Next.js middleware (non-ASCII chars)
            proxy_hide_header cf-ipcity;
            proxy_hide_header cf-ipcountry;
            proxy_hide_header cf-iplatitude;
            proxy_hide_header cf-iplongitude;
            proxy_hide_header cf-ipcontinent;
            proxy_hide_header cf-region;
            proxy_hide_header cf-region-code;
            proxy_hide_header cf-metro-code;
            proxy_hide_header cf-postal-code;
            proxy_hide_header cf-timezone;
            add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "origin-when-cross-origin" always;
        }

        # Health check (backend serves at /health, not /api/health)
        location /api/health {
            proxy_pass http://backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Backend API — long-running editorial workflow resume/stream
        location ~ ^/api/carousels/[^/]+/workflow/(resume|stream)$ {
            limit_req zone=api burst=20 nodelay;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_buffering off;
        }

        # AE-0393: Grok Bot image callbacks carry a base64 image (OpenAI
        # ImagesResponse, up to ~16 MB). The global 1 MB default would 413 every
        # callback. Same proxy settings as /api/ below; the backend enforces the
        # same 16 MB cap and authenticates with the per-job token.
        location /api/v1/image-bridge/ {
            limit_req zone=api burst=20 nodelay;
            client_max_body_size 16m;
            proxy_pass http://backend/api/v1/image-bridge/;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # AE-0418: GrokBot cover upload (POST /api/autopilot/assets). nginx's 1 MB
        # default would answer a normal 2-3 MB cover with its own HTML 413 before
        # the backend sees it; the backend caps the file at 5 MB (6m = file plus
        # multipart overhead). Same proxy settings as /api/ below.
        location = /api/autopilot/assets {
            limit_req zone=api burst=20 nodelay;
            client_max_body_size 6m;
            proxy_pass http://backend/api/autopilot/assets;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Backend API. POST /api/telegram/webhook is this prefix (AE-0356).
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend/api/;
            proxy_http_version 1.1;
            # AE-0330: without these nginx falls back to its 60s default, which
            # is shorter than a synchronous carousel workflow/start (~68s live).
            # nginx returned 504 while the backend went on to finish the run and
            # advance the project — the work landed, the client just never saw
            # it. /api/health and /api/conversations/ already carry 300s; this
            # block was the gap. Cloudflare still caps the edge at ~100s, so a
            # generation slower than that needs workflow/start made async.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Chat API — strict rate limit to prevent token cost abuse
        # proxy_buffering + gzip off is required for SSE streaming to work
        location /api/conversations/ {
            limit_req zone=chat_api burst=3 nodelay;
            proxy_pass http://backend/api/conversations/;
            proxy_http_version 1.1;
            proxy_buffering off;
            gzip off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # SSE streaming endpoints are handled by /api/ location above
    }
}
