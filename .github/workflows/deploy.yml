name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize production deploys: only one deploy runs against the droplet at a
# time. cancel-in-progress is false so an in-flight deploy (which mutates the
# server .env + swaps the image) always finishes; the next one queues behind it.
concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prune stale tracked source on server (scp does not delete removed files)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            # appleboy/scp-action OVERLAYS files but never deletes ones removed in
            # git. A file deleted or moved in a PR (e.g. a relocated component)
            # therefore lingers on the server and breaks the Docker build —
            # exactly what failed after the Phase 8 refactor. Wipe the git-tracked
            # build-context source trees so the scp below lands a clean tree.
            # Untracked server state (nginx/ssl certs, .env, docker volumes) lives
            # OUTSIDE these dirs and is preserved.
            rm -rf /opt/alter-ego/frontend/src \
                   /opt/alter-ego/frontend/scripts \
                   /opt/alter-ego/backend/src

      - name: Sync code to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "."
          target: "/opt/alter-ego"
          strip_components: 0
          # Do NOT use rm: true — it would delete server-side files like
          # nginx/ssl/cert.pem and nginx/ssl/key.pem (Cloudflare Origin
          # Certificate) which are not tracked in git. scp-action has no `exclude`
          # input (it is silently ignored), so stale-file pruning is handled by
          # the "Prune stale tracked source" step above instead. The deploy
          # checkout has no node_modules/.venv/.next to copy.

      - name: Deploy to DigitalOcean via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /opt/alter-ego

            # Write SSL certificates from secrets (self-healing if certs are ever lost)
            mkdir -p nginx/ssl
            if [ -n "${{ secrets.DO_SSL_CERT }}" ]; then
              printf '%s' '${{ secrets.DO_SSL_CERT }}' > nginx/ssl/cert.pem
            fi
            if [ -n "${{ secrets.DO_SSL_KEY }}" ]; then
              printf '%s' '${{ secrets.DO_SSL_KEY }}' > nginx/ssl/key.pem
            fi
            chmod 600 nginx/ssl/key.pem

            # Validate certificate files exist and are non-empty
            if [ ! -s nginx/ssl/cert.pem ]; then
              echo "ERROR: nginx/ssl/cert.pem is missing or empty."
              echo "Please set the DO_SSL_CERT GitHub Secret."
              exit 1
            fi
            if [ ! -s nginx/ssl/key.pem ]; then
              echo "ERROR: nginx/ssl/key.pem is missing or empty."
              echo "Please set the DO_SSL_KEY GitHub Secret."
              exit 1
            fi

            # Create/update environment file. umask 077 makes the file 600
            # from the very first byte — no world-readable window between
            # create and chmod (AE-0301: these files were 644 for ~2 months).
            umask 077
            cat > .env << 'EOF'
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            GLM_API_KEY=${{ secrets.GLM_API_KEY }}
            LLM_PROVIDER=${{ secrets.LLM_PROVIDER }}
            # AE-0391 per-task carousel models (OpenCode Go endpoint) + fallback.
            LLM_MODEL_REASONING=${{ secrets.LLM_MODEL_REASONING || 'deepseek-v4-pro' }}
            LLM_MODEL_FAST=${{ secrets.LLM_MODEL_FAST || 'deepseek-v4.1-flash' }}
            LLM_MODEL_FALLBACK=${{ secrets.LLM_MODEL_FALLBACK || 'qwen3.8-flash' }}
            LLM_MODEL_FALLBACK_REASONING=${{ secrets.LLM_MODEL_FALLBACK_REASONING || 'qwen3.8-max' }}
            CONTENT_DRAFT_CONCURRENCY=${{ secrets.CONTENT_DRAFT_CONCURRENCY || '4' }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            ANON_SECRET_KEY=${{ secrets.ANON_SECRET_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_CLOUD_SECRET_KEY }}
            LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_CLOUD_PUBLIC_KEY }}
            LANGFUSE_HOST=${{ vars.LANGFUSE_CLOUD_HOST || 'https://cloud.langfuse.com' }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            WRITING_STYLE_URLS=${{ secrets.WRITING_STYLE_URLS }}
            ALLOWED_ORIGINS=https://marinssolutions.com
            ENVIRONMENT=production
            CAROUSEL_CHECKPOINT_BACKEND=postgres
            CAROUSEL_CHECKPOINT_POSTGRES_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}
            # AE-0359 autopilot. Empty secrets stay empty while AUTOPILOT_ENABLED
            # defaults to false, so this deploy does not start the runner.
            # Flip the AUTOPILOT_ENABLED secret to true only after verification.
            META_IG_ACCESS_TOKEN=${{ secrets.META_IG_ACCESS_TOKEN }}
            META_IG_USER_ID=${{ secrets.META_IG_USER_ID }}
            CAROUSEL_PUBLIC_BASE_URL=https://marinssolutions.com
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_OWNER_CHAT_ID=${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
            TELEGRAM_WEBHOOK_SECRET=${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
            GROKBOT_API_KEY_SHA256=${{ secrets.GROKBOT_API_KEY_SHA256 }}
            CREDENTIALS_ENCRYPTION_KEY=${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
            AUTOPILOT_ENABLED=${{ secrets.AUTOPILOT_ENABLED || 'false' }}
            # AE-0572: requests can be on while spend stays off. Both default
            # false here; the secrets are what turns a test on.
            BOOST_REQUESTS_ENABLED=${{ secrets.BOOST_REQUESTS_ENABLED || 'false' }}
            BOOST_ENABLED=${{ secrets.BOOST_ENABLED || 'false' }}
            # AE-0581: standing consent for autopilot cover generation from the
            # owner's library photos; off unless the secret is 'true'.
            AUTOPILOT_COVER_CONSENT=${{ secrets.AUTOPILOT_COVER_CONSENT || 'false' }}
            # AE-0579: the boost launch and pause calls (Meta Marketing API). Empty
            # until Pedro adds the secrets; with no token the launch path is inert.
            META_ADS_ACCESS_TOKEN=${{ secrets.META_ADS_ACCESS_TOKEN }}
            META_AD_ACCOUNT_ID=${{ secrets.META_AD_ACCOUNT_ID }}
            META_PAGE_ID=${{ secrets.META_PAGE_ID }}
            META_ADS_IG_USER_ID=${{ secrets.META_ADS_IG_USER_ID }}
            AUTOPILOT_OWNER_USER_ID=${{ secrets.AUTOPILOT_OWNER_USER_ID }}
            AUTOPILOT_DAILY_CAP=${{ secrets.AUTOPILOT_DAILY_CAP || '3' }}
            AUTOPILOT_DEFAULT_PUBLISH=${{ secrets.AUTOPILOT_DEFAULT_PUBLISH || 'now' }}
            AUTOPILOT_PERSONA_ID=${{ secrets.AUTOPILOT_PERSONA_ID }}
            # AE-0407: reasoning-model slide-fix attempts after the 3 fast ones.
            # Set the AUTOPILOT_AUTOFIX_ESCALATION_ATTEMPTS variable to 0 to turn off.
            AUTOPILOT_AUTOFIX_ESCALATION_ATTEMPTS=${{ vars.AUTOPILOT_AUTOFIX_ESCALATION_ATTEMPTS || '2' }}
            # AE-0393 GrokBot image bridge (owner decision 2026-10-15): ON in prod,
            # OpenAI only when a bridge job fails. Rollback = set ENABLED=false here.
            # Without the two secrets the backend logs image_bridge_misconfigured and
            # keeps plain OpenAI (never a crash loop).
            IMAGE_BRIDGE_ENABLED=true
            IMAGE_BRIDGE_FALLBACK_ENABLED=true
            IMAGE_BRIDGE_TIMEOUT_SECONDS=${{ vars.IMAGE_BRIDGE_TIMEOUT_SECONDS || '600' }}
            IMAGE_BRIDGE_MAX_CONCURRENCY=${{ vars.IMAGE_BRIDGE_MAX_CONCURRENCY || '1' }}
            IMAGE_BRIDGE_PUBLIC_BASE_URL=https://marinssolutions.com
            GROKBOT_IMAGE_WEBHOOK_URL=${{ secrets.GROKBOT_IMAGE_WEBHOOK_URL }}
            GROKBOT_IMAGE_WEBHOOK_AUTH_HEADER=${{ vars.GROKBOT_IMAGE_WEBHOOK_AUTH_HEADER || 'Authorization' }}
            GROKBOT_IMAGE_WEBHOOK_AUTH_VALUE=${{ secrets.GROKBOT_IMAGE_WEBHOOK_AUTH_VALUE }}
            # AE-0399 model queue: DeepSeek Flash on Go, then Qwen. AE-0419: the free
            # OpenCode sidecar model was dropped: OpenCode refuses its free tier from
            # server IPs (FreeTierError even from its own CLI on the droplet, 2026-10-17).
            # Override with the LLM_MODEL_QUEUE_FAST repo variable. Breaker alerts go to a
            # send-only Telegram bot (no token = alerts off, logs only).
            LLM_MODEL_QUEUE_FAST=${{ vars.LLM_MODEL_QUEUE_FAST || 'go:deepseek-v4.1-flash,go:qwen3.8-flash' }}
            LLM_MODEL_QUEUE_REASONING=${{ vars.LLM_MODEL_QUEUE_REASONING || 'go:deepseek-v4-pro,go:qwen3.8-max' }}
            OPENCODE_SIDECAR_URL=http://opencode:4096
            OPENCODE_SERVER_PASSWORD=${{ secrets.OPENCODE_SERVER_PASSWORD }}
            # Cloudflare Worker egress for the sidecar's OpenCode API traffic
            # (ops/egress-worker). Empty = direct egress from the droplet.
            OPENCODE_EGRESS_URL=${{ secrets.OPENCODE_EGRESS_URL }}
            OPENCODE_EGRESS_TOKEN=${{ secrets.OPENCODE_EGRESS_TOKEN }}
            TELEGRAM_ALERTS_BOT_TOKEN=${{ secrets.TELEGRAM_ALERTS_BOT_TOKEN }}
            TELEGRAM_ALERTS_CHAT_ID=${{ secrets.TELEGRAM_ALERTS_CHAT_ID }}
            EOF
            # Defensive: the umask above already lands 600; keep an explicit
            # chmod so a future refactor that drops the umask still converges.
            chmod 600 .env
            if [ -e backend/.env ]; then
              chmod 600 backend/.env
            fi

            # REDIS_PASSWORD (AE-0302) must never be blank: Redis and the
            # backend both fail closed on it, so catch it here BEFORE the stack
            # is taken down.
            for var in REDIS_PASSWORD; do
              if ! grep -q "^${var}=..*" .env; then
                echo "ERROR: ${var} is empty. Set the ${var} GitHub Secret before deploying."
                exit 1
              fi
            done

            # Deploy with Docker Compose (server caches layers automatically)
            # Incident 2026-10-13: quay.io/minio/minio now returns 401 (image withdrawn).
            # Pull BEFORE down so a registry failure never leaves prod torn down, and
            # tolerate per-image pull failures so `up -d` falls back to the cached image.
            docker compose -f docker-compose.prod.yml pull --ignore-pull-failures
            # Build images first so the migration one-shot below uses the freshly
            # built backend image (and the app start that follows is cache-warm).
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml stop -t 300 generation-worker || true
            docker compose -f docker-compose.prod.yml down -t 120 --remove-orphans

            # --- Database migrations (AE-0207) --------------------------------
            # Prod used to bootstrap via SQLAlchemy create_all, which NEVER ALTERs
            # an existing table — so every model column added later silently 500'd
            # prod (caught live: caption_en, origin, distribution). Run Alembic
            # migrations to head BEFORE the app serves traffic, then assert the
            # live schema actually matches the mapped ORM columns. Both steps run
            # against the running Postgres only; the app containers are not up yet.
            # NOTE: a one-time operator reconcile (alembic stamp of the existing
            # drifted prod DB) is required ONCE before the first migrated deploy —
            # see docs/deployment/prod-migration-reconcile.md.
            docker compose -f docker-compose.prod.yml up -d postgres
            echo "--- Waiting for Postgres to be healthy ---"
            for _ in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T postgres pg_isready -U "${{ secrets.POSTGRES_USER }}" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done

            # DISABLED (AE-0207 rework): migrate-on-deploy + the pre-stack drift gate
            # removed. The read-only drift check now runs after the stack is up
            # (AE-0578, below), where it cannot keep prod down.
            # The alembic chain has TWO heads (0011_drop_audit_stream_entry_id +
            # e5f6a7b8c9d0) so `alembic upgrade head` errors, and prod was never
            # stamped — this TOOK PROD DOWN on 2026-06-18 (deploy aborted before
            # the app stack came up). Re-enable ONLY after the two heads are merged
            # AND the one-time prod `alembic stamp` reconcile is done
            # (docs/deployment/prod-migration-reconcile.md). Prod uses create_all
            # bootstrap until then.

            # --- Blog document cutover (AE-0423, ADR-0025) ---------------------
            # One-shot, idempotent data rewrite of blog_posts.content v1 -> blog.v2
            # (no DDL, no Alembic). Runs with the FRESHLY BUILT backend image while
            # only Postgres is up (no old/new app overlap). It NEVER blocks the
            # stack: the stack is already down here, so aborting would repeat the
            # 2026-06-18 outage. Its exit code (a --verify hit, a DB error mid-batch,
            # an import/settings error) is captured, the stack ALWAYS comes back up,
            # and the job fails at the very end so the deploy is red and alerts.
            # AE-0428 REMOVED the backend read fail-safe, so a failed cutover now
            # leaves non-v2 rows failing closed (public 404 / editor 422) until the
            # command is re-run. Merging was therefore gated on the owner running
            # `blog_v1_to_v2 --verify` on prod — DONE on 2026-10-19, exit 0 (zero
            # non-v2 rows, translations included).
            # Safe to re-run ad hoc.
            set +e
            docker compose -f docker-compose.prod.yml run --rm --no-deps backend \
              python -m rag_backend.scripts.blog_v1_to_v2 --apply --verify
            BLOG_CUTOVER_EXIT=$?
            set -e
            if [ "$BLOG_CUTOVER_EXIT" -ne 0 ]; then
              echo "::error::blog v2 cutover exited $BLOG_CUTOVER_EXIT; bringing the stack up anyway (AE-0428 removed the read fail-safe: non-v2 rows now fail closed until re-run), failing the job after"
            fi

            # --- Palette timestamps timezone-aware (AE-0446, Pedro's decision)
            # One-shot, idempotent DDL: palettes.created_at/updated_at
            # timestamp -> timestamptz (values read as UTC). Prod bootstraps with
            # create_all, which never alters an existing column, so this is how
            # the change of migration e6f7a8b9c0d1 reaches prod. A no-op once the
            # columns are aware. Same shape as the blog cutover: it NEVER blocks
            # the stack (exit code captured, job failed at the very end).
            set +e
            docker compose -f docker-compose.prod.yml run --rm --no-deps backend \
              python -m rag_backend.scripts.palette_timestamptz --apply --verify
            PALETTE_TZ_EXIT=$?
            set -e
            if [ "$PALETTE_TZ_EXIT" -ne 0 ]; then
              echo "::error::palette timestamptz exited $PALETTE_TZ_EXIT; bringing the stack up anyway, failing the job after"
            fi

            set +e
            docker compose -f docker-compose.prod.yml run --rm --no-deps backend \
              python -m rag_backend.scripts.carousel_phase_index --apply --verify
            PHASE_INDEX_EXIT=$?
            set -e
            if [ "$PHASE_INDEX_EXIT" -ne 0 ]; then
              echo "::error::carousel phase index exited $PHASE_INDEX_EXIT; bringing the stack up anyway, failing the job after"
            fi

            set +e
            docker compose -f docker-compose.prod.yml run --rm --no-deps backend \
              python -m rag_backend.scripts.content_versions_index --apply --verify
            CONTENT_VERSIONS_INDEX_EXIT=$?
            set -e
            if [ "$CONTENT_VERSIONS_INDEX_EXIT" -ne 0 ]; then
              echo "::error::content_versions index exited $CONTENT_VERSIONS_INDEX_EXIT; bringing the stack up anyway, failing the job after"
            fi

            set +e
            docker compose -f docker-compose.prod.yml run --rm --no-deps backend \
              python -m rag_backend.scripts.carousel_archived_at --apply --verify
            ARCHIVED_AT_EXIT=$?
            set -e
            if [ "$ARCHIVED_AT_EXIT" -ne 0 ]; then
              echo "::error::carousel archived_at exited $ARCHIVED_AT_EXIT; bringing the stack up anyway, failing the job after"
            fi

            set +e
            docker compose -f docker-compose.prod.yml run --rm --no-deps backend \
              python -m rag_backend.scripts.generation_queue_schema --apply --verify
            QUEUE_SCHEMA_EXIT=$?
            set -e
            if [ "$QUEUE_SCHEMA_EXIT" -ne 0 ]; then
              echo "::error::generation queue schema exited $QUEUE_SCHEMA_EXIT; bringing the stack up anyway, failing the job after"
            fi

            # Insight columns (AE-0578): create_all made ig_media but never adds
            # columns to the existing instagram_post_insights table, so this is how
            # the four nullable columns of migration f9a0b1c2d3e4 reach prod.
            set +e
            docker compose -f docker-compose.prod.yml run --rm --no-deps backend \
              python -m rag_backend.scripts.ig_insight_columns --apply --verify
            IG_INSIGHT_COLUMNS_EXIT=$?
            set -e
            if [ "$IG_INSIGHT_COLUMNS_EXIT" -ne 0 ]; then
              echo "::error::ig insight columns exited $IG_INSIGHT_COLUMNS_EXIT; bringing the stack up anyway, failing the job after"
            fi

            # Forced password change flag (AE-0511): create_all never adds a column
            # to the existing users table, so users.must_change_password of
            # migration b9c0d1e2f3a4 reaches prod through this one-shot.
            set +e
            docker compose -f docker-compose.prod.yml run --rm --no-deps backend \
              python -m rag_backend.scripts.must_change_password_column --apply --verify
            MUST_CHANGE_PASSWORD_EXIT=$?
            set -e
            if [ "$MUST_CHANGE_PASSWORD_EXIT" -ne 0 ]; then
              echo "::error::users must_change_password exited $MUST_CHANGE_PASSWORD_EXIT; bringing the stack up anyway, failing the job after"
            fi

            # Token version (AE-0593): create_all never adds a column to the
            # existing users table, so users.token_version of migration
            # c0d1e2f3a4b5 reaches prod through this one-shot.
            set +e
            docker compose -f docker-compose.prod.yml run --rm --no-deps backend \
              python -m rag_backend.scripts.token_version_column --apply --verify
            TOKEN_VERSION_EXIT=$?
            set -e
            if [ "$TOKEN_VERSION_EXIT" -ne 0 ]; then
              echo "::error::users token_version exited $TOKEN_VERSION_EXIT; bringing the stack up anyway, failing the job after"
            fi

            # Bring up the full stack.
            docker compose -f docker-compose.prod.yml up -d

            # Wait for services to start
            sleep 10

            # Forced password change flag, second chance (AE-0511): without the
            # column every sign-in 500s, so a failed one-shot is retried once in
            # the running backend before the drift check. Success clears the
            # failure; a second failure still fails the job at the end.
            if [ "$MUST_CHANGE_PASSWORD_EXIT" -ne 0 ]; then
              set +e
              docker compose -f docker-compose.prod.yml exec -T backend \
                python -m rag_backend.scripts.must_change_password_column --apply --verify
              MUST_CHANGE_PASSWORD_EXIT=$?
              set -e
            fi

            # Token version, second chance (AE-0593): without the column every
            # sign-in 500s, so a failed one-shot is retried once in the running
            # backend before the drift check. Success clears the failure; a
            # second failure still fails the job at the end.
            if [ "$TOKEN_VERSION_EXIT" -ne 0 ]; then
              set +e
              docker compose -f docker-compose.prod.yml exec -T backend \
                python -m rag_backend.scripts.token_version_column --apply --verify
              TOKEN_VERSION_EXIT=$?
              set -e
            fi

            # Schema drift check (AE-0578): read-only, in the running backend, so
            # the app's create_all has made any new table first. A mapped ORM
            # column missing from the live DB (a model change on an existing table
            # with no one-shot) fails the job here instead of 500ing the first
            # read. Retried while the backend finishes starting; never takes the
            # stack down (the job fails at the very end).
            SCHEMA_DRIFT_EXIT=1
            for attempt in $(seq 1 12); do
              set +e
              docker compose -f docker-compose.prod.yml exec -T backend \
                python -m rag_backend.infrastructure.database.check_drift_cli
              SCHEMA_DRIFT_EXIT=$?
              set -e
              [ "$SCHEMA_DRIFT_EXIT" -eq 0 ] && break
              sleep 10
            done

            # Post-deploy health check & diagnostics
            echo "--- Checking listening ports ---"
            ss -tlnp | grep -E ':80|:443|:3000|:8000' || true

            echo "--- Local curl to nginx ---"
            curl -s -o /dev/null -w "%{http_code}" http://localhost/ || true

            echo "--- Container status ---"
            docker compose -f docker-compose.prod.yml ps

            echo "--- Nginx logs (last 20 lines) ---"
            docker compose -f docker-compose.prod.yml logs --tail=20 nginx || true

            echo "--- Frontend logs (last 20 lines) ---"
            docker compose -f docker-compose.prod.yml logs --tail=20 frontend || true

            # AE-0302 runtime probe: unauthenticated PING must be refused
            # (NOAUTH), authenticated PING must succeed. This proves auth is
            # required NOW; the build-time config-integrity assertion (the
            # rename-command lines in redis-entrypoint.sh, unit-tested) is what
            # guarantees auth cannot be re-opened via CONFIG SET.
            echo "--- Redis auth probe (AE-0302) ---"
            if docker compose -f docker-compose.prod.yml exec -T redis redis-cli ping 2>&1 | grep -q PONG; then
              echo "ERROR: unauthenticated redis-cli PING returned PONG — Redis is OPEN. Failing the deploy."
              exit 1
            fi
            docker compose -f docker-compose.prod.yml exec -T redis sh -c 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping' | grep -q PONG

            # AE-0301: post-deploy stat assertion — a secret-file permissions
            # regression (or a reappearing plaintext .env.backup*) FAILS the
            # deploy under `set -e`; it is not a log line. The script is synced
            # by the scp step above.
            echo "--- Secret file permissions check (AE-0301) ---"
            bash scripts/deploy/check-env-permissions.sh /opt/alter-ego /opt/alter-ego/.env /opt/alter-ego/backend/.env

            # Clean up old images
            docker image prune -af --filter "until=168h"

            # AE-0423: surface a failed blog cutover only now, with the stack up
            # (AE-0428: there is no read fail-safe anymore, so re-run the cutover).
            if [ "$BLOG_CUTOVER_EXIT" -ne 0 ]; then
              echo "::error::blog v2 cutover failed (exit $BLOG_CUTOVER_EXIT): run 'python -m rag_backend.scripts.blog_v1_to_v2 --dry-run' / '--apply --verify' on the droplet"
              exit 1
            fi

            ONE_SHOT_FAILED=0
            if [ "$PALETTE_TZ_EXIT" -ne 0 ]; then
              echo "::error::palette timestamptz failed (exit $PALETTE_TZ_EXIT): run 'python -m rag_backend.scripts.palette_timestamptz --apply --verify' on the droplet"
              ONE_SHOT_FAILED=1
            fi
            if [ "$PHASE_INDEX_EXIT" -ne 0 ]; then
              echo "::error::carousel phase index failed (exit $PHASE_INDEX_EXIT): run 'python -m rag_backend.scripts.carousel_phase_index --apply --verify' on the droplet"
              ONE_SHOT_FAILED=1
            fi
            if [ "$CONTENT_VERSIONS_INDEX_EXIT" -ne 0 ]; then
              echo "::error::content_versions index failed (exit $CONTENT_VERSIONS_INDEX_EXIT): run 'python -m rag_backend.scripts.content_versions_index --apply --verify' on the droplet"
              ONE_SHOT_FAILED=1
            fi
            if [ "$ARCHIVED_AT_EXIT" -ne 0 ]; then
              echo "::error::carousel archived_at failed (exit $ARCHIVED_AT_EXIT): run 'python -m rag_backend.scripts.carousel_archived_at --apply --verify' on the droplet"
              ONE_SHOT_FAILED=1
            fi
            if [ "$QUEUE_SCHEMA_EXIT" -ne 0 ]; then
              echo "::error::generation queue schema failed (exit $QUEUE_SCHEMA_EXIT): run 'python -m rag_backend.scripts.generation_queue_schema --apply --verify' on the droplet"
              ONE_SHOT_FAILED=1
            fi
            if [ "$IG_INSIGHT_COLUMNS_EXIT" -ne 0 ]; then
              echo "::error::ig insight columns failed (exit $IG_INSIGHT_COLUMNS_EXIT): run 'python -m rag_backend.scripts.ig_insight_columns --apply --verify' on the droplet"
              ONE_SHOT_FAILED=1
            fi
            if [ "$MUST_CHANGE_PASSWORD_EXIT" -ne 0 ]; then
