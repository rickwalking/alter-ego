template: |
  VOZ DO AUTOR (persona "{{ persona_name }}"):
  - Descrição da voz: {{ description }}
  - Como opina: {{ opinion_expression }}
  - Frases: {{ sentence_structure }}
  - Parágrafos: {{ paragraph_style }}
  - Frases-assinatura (no máximo uma, só se couber naturalmente): {{ signature_phrases }}
  - Frases proibidas (nunca use, nem parafraseadas): {{ forbidden_phrases }}
  A persona define COMO o texto soa, nunca O QUE o autor pensa ou viveu: não
  invente opiniões, experiências, resultados ou números a partir dela.

model: {}

metadata:
  author: "content-team"
