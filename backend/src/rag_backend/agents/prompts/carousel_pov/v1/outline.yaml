---
name: carousel_pov_outline
version: "1.0.0"
description: "Plan an 8-10 slide 'Ponto de Vista' carousel from the owner's thesis (AE-0375)"

template: |
  Planeje um carrossel do Instagram no modo "Ponto de Vista" com EXATAMENTE
  {{ slide_count }} slides, em português do Brasil, na voz do autor (primeira pessoa).

  Tese do autor (OBRIGATÓRIA; é a opinião dele, o centro do carrossel):
  {{ thesis }}

  Prova pessoal do autor (uma experiência real; pode estar vazia):
  {{ personal_proof or "(nenhuma)" }}

  Tema: {{ topic }}
  Público: {{ audience }}
  Brief: {{ brief }}
  Formato: {{ pov_format }}
  Fontes (opcionais; o modo não exige pesquisa):
  {{ sources }}

  Narrativa do formato:
  {% if pov_format == "como_eu_faco" -%}
  Promessa -> meu contexto -> passos (um por slide de ponto) -> erro comum -> checklist.
  {%- elif pov_format == "erros_e_mitos" -%}
  "X erros" (ou mitos) -> um erro e a correção por slide de ponto -> virada.
  {%- elif pov_format == "comparacao" -%}
  "O que eu uso para cada tarefa": uma tarefa por slide de ponto, com o que o autor
  usa e por quê. Só a partir da prova pessoal do autor; nunca invente benchmarks.
  {%- else -%}
  Tese -> por quê -> evidência -> contraponto -> virada -> veredito.
  {%- endif %}

  Papel de cada slide, nesta ordem (não mude a ordem nem a quantidade):
  {% for role in roles %}
  {{ loop.index }}. {{ role }}
  {% endfor %}

  O que cada papel faz:
  - hook: o gancho do slide 1 (até 10 palavras), defendendo a tese.
  - rehook: uma frase de tensão que funciona sozinha mesmo se for mostrada como
    primeiro slide; nomeia a dor ou o que está em jogo.
  - pov: "Por que eu digo isso": a linha de assinatura do autor e a prova pessoal.
    Sem prova pessoal, argumente pelo raciocínio, nunca com uma história inventada.
  - point: UMA ideia por slide, que sustenta a tese.
  - twist: o ponto contraintuitivo, o que faz alguém mandar o post para outra pessoa.
  - save: um checklist ou resumo de uma tela, feito para ser salvo (3 a 5 itens).
  - cta: uma única ação (seguir, mandar ou comentar).

  Regras (todas obrigatórias):
  - A tese aparece no slide 1 ou no slide 2.
  - No máximo UM slide sobre "o que aconteceu" (notícia); o resto é o que isso
    muda para quem lê, segundo quem constrói com IA.
  - O modelo pode afiar a tese do autor, NUNCA inventá-la ou trocá-la.
  - Nunca invente opiniões, experiências, resultados de teste, clientes ou números.
    Use só a tese, a prova pessoal e as fontes acima.
  - Sem emoji, sem travessão (— ou –).

  {{ presentation_policy_context }}

  Responda SOMENTE com um JSON array de EXATAMENTE {{ slide_count }} objetos:
  {slide_index, role, title, key_points}

  {{ persona_context }}
  {{ revision_notes }}

model:
  temperature: 0.5
  max_tokens: 2048

metadata:
  author: "content-team"
  created_at: "2026-10-15"
  tags: ["carousel", "pov", "outline", "pov-hook-v1", "growth-plan"]
