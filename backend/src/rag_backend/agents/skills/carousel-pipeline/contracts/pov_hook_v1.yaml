# AE-0374 (ADR-0021): "Ponto de Vista" contract, growth plan 16.3 C. 8-10
# slides: hook (owner's photo, no artwork) -> rehook -> "por que eu digo isso"
# (personal proof) -> 2-4 points -> twist (the "send" slide) -> save checklist
# -> CTA with one goal. The four point slides are ``optional`` from the third
# on: ``expand_policy_for_count`` keeps ``count - 6`` of them. Every role maps
# onto an existing slide type, so the v3 validators, casing rules and
# translation keep working. Copy budgets keyed by slide type carry the
# loosest role budget; tighter role budgets are prompt guidance.
version: pov_hook_v1
slide_count: 10
slide_count_min: 8
slide_count_max: 10
slide_count_default: 9

slide_sequence:
  - slide_number: 1
    slide_type: intro
    role: hook
    image_required: false
    copy_start_ratio: 0.55
  - slide_number: 2
    slide_type: content
    role: rehook
    image_required: false
    copy_start_ratio: 0.54
  - slide_number: 3
    slide_type: content
    role: pov
    image_required: false
    copy_start_ratio: 0.54
  - slide_number: 4
    slide_type: content
    role: point
    image_required: true
    copy_start_ratio: 0.54
  - slide_number: 5
    slide_type: content
    role: point
    image_required: true
    copy_start_ratio: 0.54
  - slide_number: 6
    slide_type: content
    role: point
    image_required: true
    optional: true
    copy_start_ratio: 0.54
  - slide_number: 7
    slide_type: content
    role: point
    image_required: true
    optional: true
    copy_start_ratio: 0.54
  - slide_number: 8
    slide_type: content
    role: twist
    image_required: false
    copy_start_ratio: 0.54
  - slide_number: 9
    slide_type: summary
    role: save
    image_required: false
    copy_start_ratio: 0.54
  - slide_number: 10
    slide_type: cta
    role: cta
    image_required: false
    avatar_required: true

image_scope:
  artwork_slides: [4, 5, 6, 7]
  cta_avatar_required: true

visible_text_rules:
  - rule_id: visible_emoji_forbidden
    summary: No decorative emoji in visible slide text.
  - rule_id: dash_punctuation_forbidden
    summary: No em dash or en dash in visible slide text.
  - rule_id: ascii_hyphen_prose_forbidden
    summary: No ASCII hyphen used as prose punctuation outside protected tokens.
  - rule_id: english_heading_sentence_case
    summary: English headings start with an uppercase alphabetic character.
  - rule_id: portuguese_heading_sentence_case
    summary: Portuguese headings start with an uppercase alphabetic character.
  - rule_id: portuguese_body_sentence_case
    summary: Portuguese body sentences start with an uppercase alphabetic character.
  - rule_id: english_body_sentence_case
    summary: English body sentences start with an uppercase alphabetic character.
  - rule_id: structured_item_sentence_case
    summary: Feature, summary-point and action titles and bodies use sentence case in both locales.
  - rule_id: body_required
    summary: Every non-CTA slide has visible copy below its heading (a body, or items on summary and closing).
  - rule_id: proper_noun_casing
    summary: Configured proper nouns match their canonical casing in both locales.
  - rule_id: bilingual_structural_parity
    summary: PT and EN slides share slide type, intent, and structured-extra shape.
  - rule_id: drafting_scaffold_forbidden
    summary: "No drafting labels on slides: locale markers (PT, PT-BR, EN, EN-US) or field labels (Heading, Body, CTA creator, TL;DR), or source URLs."
  - rule_id: body_must_not_repeat_heading
    summary: Body copy must not repeat the heading text.
  - rule_id: accent_highlight_at_most_one
    summary: Visible text uses at most one accent-highlighted phrase.
  - rule_id: lucide_icon_name_required
    summary: Structured icons use Lucide icon_name values from the policy allowlist.

# AE-0312: severity tier per violation code. A report blocks approval only when
# a blocker-severity violation remains. The loader asserts every casing rule
# below carries a severity here (load fails otherwise).
# AE-0366: sentence-case rules (PT + EN, headings, bodies and structured items)
# and body_empty are BLOCKERS: prod carousel 8e350d6e shipped all-lowercase
# slides and a title-only slide while the report said valid. Every objective
# quality_rubric item below is enforced by a blocker rule.
rule_severities:
  slide_count_invalid: blocker
  slide_type_invalid: blocker
  heading_empty: blocker
  heading_not_sentence_case_en: blocker
  visible_emoji_forbidden: blocker
  dash_punctuation_forbidden: blocker
  body_too_long: blocker
  copy_too_many_lines: blocker
  heading_too_long: blocker
  structured_extra_missing: blocker
  structured_extra_shape_mismatch: blocker
  heading_repeated_in_body: blocker
  drafting_scaffold_present: blocker
  slide_parse_failed: blocker
  translation_missing: blocker
  translation_shape_mismatch: blocker
  icon_name_not_allowlisted: blocker
  heading_not_sentence_case_pt: blocker
  body_not_sentence_case_pt: blocker
  body_not_sentence_case_en: blocker
  body_empty: blocker
  closing_actions_missing: blocker
  summary_points_missing: blocker
  translation_not_english: blocker
  emphasis_markup_invalid: blocker
  # AE-0436: PT copy uses **…**, EN copy uses <strong>…</strong> (AE-0403/
  # AE-0414). A field with the other locale's markup is a blocker; the
  # deterministic repair normalizes it at write time.
  emphasis_markup_locale_mismatch: blocker
  proper_noun_casing: blocker
  # AE-0375: POV rubric codes (deck-level, presentation_deck_rules.py). The
  # first-person check is a heuristic, so it warns instead of blocking.
  hook_word_limit: blocker
  first_person_missing: warning
  # AE-0401: copy-hygiene rules (presentation_copy_rules.py). Prod carousel
  # 98a2e2f0 shipped a fenced JSON blob, an HTML tag and a Markdown heading as
  # visible copy; each is a blocker the autopilot fixes before a human sees it.
  structured_payload_in_copy: blocker
  markup_leak: blocker
  emphasis_unbalanced: blocker
  assistant_chatter: blocker
  placeholder_text: blocker
  encoding_garbled: blocker
  copy_truncated: blocker
  body_too_short: blocker
  wrong_language: blocker
  repeated_text: blocker
  structured_item_split: blocker

# AE-0312: PT casing rules + configurable proper-noun list. Maintenance
# ownership is documented in contracts/README.md — add product names here (a
# policy edit, no code deploy). ``exempt_slide_types`` lets a stylistic
# all-lowercase slide type opt out of a rule explicitly (the allowlist).
# AE-0366: EN heading/body rules (the EN heading rule here governs structured
# item titles and the casing repair; the slide heading itself is always checked)
# and body_empty, which the CTA is exempt from.
casing:
  proper_nouns:
    - Claude
    - Anthropic
    - Google
    - Brasil
    - Argon
    - CWE-Bench
    - AppSec
    - Real2Sim
  rules:
    - code: heading_not_sentence_case_pt
      exempt_slide_types: []
    - code: body_not_sentence_case_pt
      exempt_slide_types: []
    - code: heading_not_sentence_case_en
      exempt_slide_types: []
    - code: body_not_sentence_case_en
      exempt_slide_types: []
    - code: body_empty
      exempt_slide_types: [cta]
    - code: proper_noun_casing
      exempt_slide_types: []
    # AE-0401: the hook's sub-hook and the CTA are fragments, not sentences.
    - code: copy_truncated
      exempt_slide_types: [intro, cta]

# AE-0366: the LLM quality rubric. SINGLE SOURCE OF TRUTH for the checklist the
# content drafter and the EN translator must satisfy (rendered into their
# prompts with a self-check step) AND for the validator: every item lists the
# rule codes that enforce it, and the loader fails if a code has no severity.
quality_rubric:
  - rubric_id: sentence_case
    instruction: >-
      Sentence case: every heading, body, feature/action/summary-point title and
      body starts with an uppercase letter (or a digit). Never write a heading or
      a sentence entirely in lowercase.
    rule_codes:
      - heading_not_sentence_case_pt
      - heading_not_sentence_case_en
      - body_not_sentence_case_pt
      - body_not_sentence_case_en
    audiences: [content, translation]
  - rubric_id: proper_nouns
    instruction: >-
      Proper nouns, brands, products, places and acronyms keep their canonical
      capitals (Argon, Google, Brasil, CWE-Bench, AppSec, Real2Sim). Only
      officially lowercase brands (iPhone, eBay, macOS) start lowercase.
    rule_codes:
      - proper_noun_casing
    audiences: [content, translation]
  - rubric_id: no_empty_slides
    instruction: >-
      No empty slides: every slide except the CTA has visible copy under its
      heading. A content slide has a non-empty body OR a filled features list
      (3-4 items, each with an icon_name, a title and a body). A closing slide
      has 3 actions, each with an icon_name, a title and a body.
    rule_codes:
      - body_empty
      - closing_actions_missing
    audiences: [content]
  - rubric_id: summary_points
    instruction: >-
      A summary slide has a filled summary_points list: 3 points, each with an
      icon_name, a title and a body.
    rule_codes:
      - summary_points_missing
    audiences: [content]
  - rubric_id: english_is_english
    instruction: >-
      The English copy (presentation_en / translations) is actually written in
      English. Never paste the Portuguese copy into the English fields.
    rule_codes:
      - translation_not_english
    audiences: [content, translation]
  - rubric_id: strong_emphasis_only
    instruction: >-
      HTML emphasis uses <strong>...</strong> only, with balanced, non-nested
      tags. Keep every <strong> tag from the source when translating. Bold
      ** marks come in pairs, never empty.
    rule_codes:
      - emphasis_markup_invalid
      - emphasis_unbalanced
    audiences: [content, translation]
  # AE-0401: the copy is the copy, nothing else.
  - rubric_id: plain_slide_copy
    instruction: >-
      Write only the slide copy as plain text: no JSON, no code fences, no keys
      such as "heading" or "body", no HTML tags other than <strong>, no Markdown
      headings (#),
      lists, tables or backticks, no literal \n. No chat preamble ("Here is",
      "Claro! Aqui está"), no notes about the task, no placeholders ([insert],
      {topic}, TODO, lorem ipsum).
    rule_codes:
      - structured_payload_in_copy
      - markup_leak
      - assistant_chatter
      - placeholder_text
      - encoding_garbled
    audiences: [content, translation]
  - rubric_id: complete_sentences
    instruction: >-
      Every body is complete: it ends with . ! or ? (never "...", a comma, a
      colon or a dangling "e"/"and"). A content slide body has at least 8
      words. Never repeat a sentence or write a word twice in a row. An item
      title is a whole phrase: never cut it on "ou", "e", "de", "com".
    rule_codes:
      - copy_truncated
      - body_too_short
      - repeated_text
      - structured_item_split
    audiences: [content, translation]
  - rubric_id: right_language
    instruction: >-
      The Portuguese copy is in Portuguese and the English copy is in English.
    rule_codes:
      - wrong_language
    audiences: [content, translation]
  - rubric_id: length_limits
    instruction: >-
      Respect the copy budgets of the presentation contract (max characters and
      max rendered lines per heading, body and item).
    rule_codes:
      - heading_too_long
      - body_too_long
      - copy_too_many_lines
    audiences: [content, translation]

  # AE-0375: POV rubric (growth plan 16.3 C). "Thesis on slide 1 or 2" is an
  # outline check shown at the outline gate; "at most one news slide" is the
  # contract shape (no news role) and the outline prompt.
  - rubric_id: hook_word_limit
    instruction: >-
      The slide 1 heading is the hook: at most 10 words and 60 characters, it
      makes sense to a stranger with no context, and the carousel pays it off.
    rule_codes:
      - hook_word_limit
    audiences: [content]
  - rubric_id: first_person_present
    instruction: >-
      At least 3 slides speak in the author's first person ("Eu", "meu",
      "minha", "no meu trabalho"). Never invent an experience, a test result
      or a number to sound personal; use only the thesis and the personal proof.
    rule_codes:
      - first_person_missing
    audiences: [content]

lucide_icon_allowlist:
  - chart-column
  - book-open
  - newspaper
  - brain
  - target
  - eye
  - message-circle
  - shield-check
  - wrench
  - flask-conical

copy_budgets:
  # Hook: <=60 chars and <=10 words (word limit enforced by hook_word_limit).
  intro_heading:
    max_characters: 60
    max_lines: 3
  # Optional one-line sub-hook. AE-0401: at most one line (~40 chars) so the
  # hook copy never covers the owner's face on the photo.
  intro_subtitle:
    max_characters: 40
    max_lines: 1
  summary_heading:
    max_characters: 64
    max_lines: 3
  # Save checklist items (3-5), each <=60.
  summary_point_title:
    max_characters: 60
  summary_point_body:
    max_characters: 90
  content_heading:
    max_characters: 64
    max_lines: 3
  # Loosest content role (pov slide, <=200). Rehook <=90 and point/twist <=160
  # are prompt budgets (carousel_pov/v1/content.yaml).
  content_body:
    max_characters: 200
    max_lines: 6
  feature_title:
    max_characters: 32
  feature_body:
    max_characters: 100
  closing_action_title:
    max_characters: 30
  closing_action_body:
    max_characters: 90
  cta_creator_name:
    max_characters: 60
  cta_handle:
    max_characters: 80
  cta_website:
    max_characters: 80

geometry:
  viewport_standard:
    width: 1080
    height: 1350
  viewport_hd:
    width: 2160
    height: 2700
  footer_gap_standard: 24
  footer_gap_hd: 48
  tolerance_standard: 1
  tolerance_hd: 2
  near_limit_standard: 8
  near_limit_hd: 16
  selectors:
    slide_root: "[data-slide-number]"
    artwork: ".slide-artwork"
    presentation: ".slide-presentation"
    copy: ".slide-presentation-copy"
    footer: ".slide-footer"
    cta_card: ".creator-card"
    cta_avatar: ".closing-avatar img"

fonts:
  heading_family: "'Inter', system-ui, -apple-system, sans-serif"
  body_family: "'Inter', system-ui, -apple-system, sans-serif"
  badge_family: "'JetBrains Mono', monospace"

intentional_lowercase_allowlist:
  - iPhone
  - eBay
  - macOS
