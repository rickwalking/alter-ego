[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
pythonpath = src
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
# AE-0417: dump every thread's stack when a test (setup, call or teardown)
# runs past 10 min, so a hang in CI shows where it is stuck.
faulthandler_timeout = 600
